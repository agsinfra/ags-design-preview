<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Decision board · AGS design review</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f2f2ef;--paper:#fff;--tint:#faf9f6;--ink:#1c1c1c;--muted:#5c5955;--rule:#d6d4cf;--soft-rule:#e8e6e1;--maroon:#661414;
  --keep:#2f6b3a;--change:#8a5a00;--drop:#9b1c1c;--question:#2a5d9b;
  --frame:"Hanken Grotesk",system-ui,sans-serif;--arabic:"Noto Kufi Arabic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --wrap:1560px;--gutter:clamp(16px,3vw,40px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--ground);color:var(--ink);font:400 .9375rem/1.5 var(--frame);-webkit-font-smoothing:antialiased}
[dir="rtl"] body,[lang="ar"]{font-family:var(--arabic)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2a6fb5;outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:.8125em;letter-spacing:0}

/* Header */
.head{background:var(--paper);border-bottom:1px solid var(--rule)}
.head .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;min-height:64px;padding-block:10px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand img{width:118px}
.brand span{font-weight:600;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.head .tools{margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.who{font-size:.875rem;color:var(--muted);margin-inline-end:6px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-size:.875rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.demo{background:#fff4d6;border-bottom:1px solid #ecd9a4;font-size:.875rem;padding-block:6px}

.intro{padding-block:28px 8px}
.intro h1{font-size:clamp(1.75rem,1.2rem + 1.6vw,2.5rem);line-height:1.1;letter-spacing:-.02em;margin:0}
.intro p{color:var(--muted);margin:8px 0 0;max-width:72ch}
.intro .summary{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.875rem;max-width:none;color:var(--ink)}
.summary b{font-weight:600}

/* Filters + sticky concept header */
.bar{position:sticky;top:0;z-index:5;background:rgba(242,242,239,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-top:16px}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;padding-block:12px}
.filters label{display:grid;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
.filters select,.filters input{min-height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:0 10px;font-size:.875rem;font-weight:400;color:var(--ink)}
.filters input{width:min(260px,70vw)}
.filters .updated{margin-inline-start:auto;font-size:.8125rem;color:var(--muted);align-self:center}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding-bottom:8px}
.cols div{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.875rem;padding-inline:14px}
.badge{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:6px;font:600 .8125rem/1 var(--frame);border:1px solid rgba(0,0,0,.18)}
.badge.A{background:#fff;color:#661414}
.badge.B{background:#121212;color:#f6f5f2}
.badge.C{background:#fbf3e3;color:#661414}
.badge.D{background:#1c1c1c;color:#e3c28f;border-color:#e3c28f}

/* Rows */
main{padding-block:20px 80px}
.area{margin-top:28px}
.area>h2{font-size:1.125rem;margin:0 0 12px;letter-spacing:-.01em}
.area>h2 small{font-weight:400;color:var(--muted);font-size:.875rem;margin-inline-start:8px}
.row{background:var(--paper);border:1px solid var(--rule);border-radius:12px;margin-bottom:14px;overflow:hidden}
.row-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--soft-rule)}
.row-head h3{font-size:1.0625rem;margin:0;letter-spacing:-.005em}
.row-head .mono{color:var(--muted)}
.row-head .count{color:var(--muted);font-size:.8125rem}
.pill{margin-inline-start:auto;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:#eceae5;color:var(--muted)}
.pill.decided{background:#e1f0e3;color:var(--keep)}
.pill.discuss{background:#fbecc9;color:var(--change)}
.pill.deferred{background:#e7e7e7;color:#4a4a4a}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{padding:12px 14px 14px;border-inline-end:1px solid var(--soft-rule);min-width:0}
.cell:last-child{border-inline-end:0}
.cell.missing{background:repeating-linear-gradient(135deg,transparent 0 8px,#f6f5f2 8px 16px);color:var(--muted);font-size:.875rem}
.cell-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.8125rem}
.cell-head .badge{display:none}
.cell-head a{font-weight:600}
.cell-head .route{color:var(--muted);word-break:break-all}
.hint{color:var(--muted);font-size:.8125rem;margin:6px 0 0}
.hint button{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
.counts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.counts span{font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.v-keep{color:var(--keep)}.v-change{color:var(--change)}.v-drop{color:var(--drop)}.v-question{color:var(--question)}
.notes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.note{border-inline-start:3px solid var(--rule);padding-inline-start:10px}
.note.keep{border-color:var(--keep)}.note.change{border-color:var(--change)}.note.drop{border-color:var(--drop)}.note.question{border-color:var(--question)}
.note .verdict{font-size:.75rem;font-weight:600}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:.75rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.meta a{color:var(--ink);font-weight:600}
.replies{list-style:none;margin:6px 0 0;padding:0 0 0 0;display:grid;gap:6px}
.replies li{background:var(--tint);border-radius:6px;padding:6px 8px}
.replies p{margin:0}
.empty{color:var(--muted);font-size:.8125rem;margin:8px 0 0}

/* Decision */
.decision{border-top:1px solid var(--soft-rule);background:var(--tint);padding:12px 16px}
.decision h4{font-size:.8125rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.decision form{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 20px;align-items:start}
.decision fieldset{border:0;margin:0;padding:0;min-width:0}
.decision legend{font-size:.75rem;font-weight:600;color:var(--muted);padding:0;margin-bottom:4px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;font-size:.8125rem;font-weight:600}
.choices input{accent-color:var(--maroon);margin:0}
.choices label:has(input:checked){border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
.decision textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:.875rem;line-height:1.45}
.decision .side{display:grid;gap:8px;justify-items:start}
.decision .state{font-size:.75rem;color:var(--muted)}
.decision .state.error{color:var(--drop)}

/* Panels */
.panel{max-width:520px;margin:12vh auto;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:28px}
.panel h1{font-size:1.375rem;margin:0 0 8px}
.panel p{color:var(--muted);margin:0 0 16px}
.panel form{display:flex;gap:8px;flex-wrap:wrap}
.panel input{flex:1;min-width:200px;min-height:40px;border:1px solid var(--rule);border-radius:8px;padding:0 12px}
.panel .error{color:var(--drop)}

/* Who's reviewing? */
.who-name{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.who{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.who-backdrop{position:absolute;inset:0;background:rgba(18,18,18,.45)}
.who-card{position:relative;width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.who-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who-head h2{margin:0;font-size:1.25rem}
.who-head .btn{width:36px;justify-content:center;padding:0;font-size:1.25rem}
.who-card>p{color:var(--muted);margin:8px 0 14px}
.who-card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.person{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);text-align:start;font-weight:600;cursor:pointer}
.person:hover,.person.on{border-color:var(--maroon)}
.person.on{box-shadow:inset 0 0 0 1px var(--maroon)}
.linkish{margin-top:14px;background:none;border:0;padding:0;font-weight:600;color:var(--maroon);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.who-add{margin-top:16px;padding-top:14px;border-top:1px solid var(--soft-rule)}
.who-add label{display:block;font-weight:600;margin-bottom:6px}
.who-add div{display:flex;gap:8px}
.who-add input{flex:1;min-width:0;min-height:40px;border:1px solid var(--rule);border-radius:8px;padding:0 12px}
.who-card .error{color:var(--drop);margin:10px 0 0}

@media (max-width:1100px){
  .cols{display:none}
  .cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell:nth-child(2){border-inline-end:0}
  .cell:nth-child(-n+2){border-bottom:1px solid var(--soft-rule)}
  .cell-head .badge{display:inline-grid}
  .decision form{grid-template-columns:1fr}
}
@media (max-width:640px){
  .cells{grid-template-columns:1fr}
  .cell{border-inline-end:0;border-bottom:1px solid var(--soft-rule)}
  .cell:last-child{border-bottom:0}
}
@media print{
  .bar,.head .tools,.decision form .side{display:none}
  .row{break-inside:avoid}
}
</style>
<script type="module" src="board.js"></script>
</head>
<body>
<div id="app"><p class="wrap" style="padding-top:40px">Loading…</p></div>
<noscript><p class="wrap">The decision board needs JavaScript.</p></noscript>
</body>
</html>
